[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-alpha-slicer"
version = "0.5.1"
description = "Decompose the original academic reference alpha into economic spanning mechanisms and remaining intercept, with separate risk diagnostics and robust inference."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["alpha_slicer*"]
